<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Formatter &amp; Validator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>JSON Formatter &amp; Validator</h1>

      <label for="jsonInput">Paste your JSON here:</label>
      <textarea
        id="jsonInput"
        name="jsonInput"
        rows="12"
        placeholder='Example: {"name": "Ada"}'
      ></textarea>

      <button id="validateButton" type="button">Validate JSON</button>
      <button id="formatButton" type="button">Format JSON</button>

      <p id="statusMessage" class="status" aria-live="polite">
        No check run yet.
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
